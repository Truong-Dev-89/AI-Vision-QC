# Copy this file to <product_id>.yaml when adding a new product. Don't edit _template directly.

product_id: new_product_name          # lowercase, underscores, no accents
display_name: "Name shown to the operator"

camera:
  device_id: 0                        # camera id or RTSP URL
  roi: [0, 0, 1920, 1080]             # region of interest x, y, width, height
  trigger_mode: "external"            # external (triggered by the conveyor) | manual

model:
  algorithm: "patchcore"              # patchcore | padim | yolo | ...
  path: "models/new_product_name/v1/bank.pt"
  backbone: "wide_resnet50_2"

decision:
  threshold: 0.85                     # anomaly score threshold
  suspect_margin: 0.15                # within [threshold, threshold+margin] -> suspect, route to a human
  # below threshold: pass | within margin: suspect | above threshold+margin: clear defect

data:
  good_dir: "data/raw/new_product_name/good"
  suspect_dir: "data/raw/new_product_name/suspect"
  confirmed_ng_dir: "data/raw/new_product_name/confirmed_ng"

integration:
  plc_signal_pass: "DO_1"             # output signal on pass
  plc_signal_reject: "DO_2"           # output signal on reject
  mes_product_code: "MES_PRODUCT_CODE" # product code matching the MES system

retrain:
  schedule: "weekly"                  # weekly | monthly | manual
  min_new_samples: 50                 # only trigger retraining once this many new images accumulate
